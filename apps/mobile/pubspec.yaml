name: connect_mobile
description: Accessibility-first live support and community app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  flutter_webrtc: ^1.4.1
  http: ^1.2.2

dependency_overrides:
  flutter_tts:
    path: ../../third_party/flutter_tts
  flutter_webrtc:
    path: ../../third_party/flutter_webrtc

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.31.0

flutter:
  uses-material-design: true
